[project]
name = "rrts-inspection-intelligence"
version = "1.2.0"
description = "RRTS Autonomous Rail Inspection Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pydantic==1.10.13",
    "numpy>=1.22.0",
    "requests>=2.28.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
]

[tool.vercel]
entrypoint = "backend_server:app"
